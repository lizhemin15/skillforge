<!doctype html>
<html lang="zh-CN" data-site-page="index">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillForge — 智能写作工坊</title>
  <meta name="description" content="以 Skill 为核心的文章写作 AI 系统。像聊天一样，告诉它你想写什么，引擎自动调度最合适的写作技能帮你成文。">
  <link rel="stylesheet" href="/assets/css/style.css?v=20260920A">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/dm-sans-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/montserrat-latin.woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234d6bfe'/><rect x='9' y='9' width='6' height='14' rx='2' fill='%23ffffff'/><rect x='17' y='9' width='6' height='14' rx='2' fill='%23c3d0ff'/></svg>">
</head>
<body>
<!-- 环境渐变层：毛玻璃的"成因"，没有它再多的 backdrop-filter 也只会糊出纯色 -->
<div class="ds-bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="layout ch-lock">

  <!-- 会话侧边栏 -->
  <aside class="sb" id="sidebar">
    <div class="sb-inner">
      <button class="sb-new" id="sb-new">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>新对话</span>
        <kbd class="sb-new-kbd">⌘N</kbd>
      </button>
      <div class="sb-list" id="sb-list">
        <!-- conversation items + empty state are rendered by js/chat.js router.render() -->
      </div>
      <div class="sb-foot">
        <span class="sb-count" id="sb-count"></span>
        <button class="sb-clear hidden" id="sb-clear" title="清空全部会话">清空</button>
      </div>
    </div>
  </aside>

  <!-- 侧边栏开关（叠在 topbar 右侧，不挤布局） -->
  <button class="sb-toggle" id="sb-toggle" aria-label="会话列表">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand"><span class="dot"></span><span data-site-name>SkillForge</span><small data-site-tagline>智能写作工坊</small></a>
      <nav class="nav">
        <a href="/admin" class="ghost">管理端</a>
      </nav>
    </div>
  </header>

  <main class="ch-main">
    <div class="ch-scroll" id="chat-scroll">
      <div class="ch-col" id="chat-col">
        <!-- 空态：只留一句话。欢迎语/示例句/技能卡片全部搬到输入框上方的推荐行，
             界面上"可点的东西"从 20+ 个降到 3 处（推荐行 · 模式胶囊 · 发送）。 -->
        <div class="ch-welcome" id="welcome">
          <h1>想写点什么？</h1>
        </div>
      </div>
    </div>

    <!-- 推荐行：全页唯一的多入口。内容随对话动态生成（chat.js renderChips），
         默认是"你可以这样说"的推荐动作；切到「指定技能」后这一行变成打开技能勾选层的入口。
         点击行为是**把话填进输入框**（不直接发），用户能先改两个字再发。 -->
    <div class="ch-chips-wrap" id="chips-wrap">
      <!-- 技能勾选层（下拉）：「指定技能」档专用，从推荐行往上弹出。
           为什么要有个层：推荐行只有 4 颗的位置，技能库有几十上百个 ——
           之前那一版只能显示前 4 个，剩下的用户永远点不到（"都没法选指定技能"）。
           放在 #chips 外面：renderChips() 每次会清空 #chips 的 innerHTML，
           层要是在里面就会被一起清掉。 -->
      <div class="ch-sklayer" id="sk-layer" hidden>
        <input type="text" class="ch-sklayer-q" id="sk-q" autocomplete="off"
               placeholder="搜索技能名或用途…" aria-label="搜索技能">
        <div class="ch-sklayer-list" id="sk-list" role="listbox" aria-label="选择技能"></div>
        <div class="ch-sklayer-foot" id="sk-foot"></div>
      </div>
      <div class="ch-chips" id="chips" aria-live="polite"></div>
    </div>

    <!-- 输入区：框内只有一个胶囊，滑动在「自动调度 / 指定技能」两档之间 -->
    <div class="ch-input-bar">
      <div class="ch-input-box">
        <!-- 对话方式胶囊独占第一行（.ch-mrow 是整行）。
             它原来和 textarea 挤在同一行 → 输入框被推到右边、宽度只剩 630/860，
             用户要求「输入框应当占据所有的位置」，所以拆行。 -->
        <div class="ch-mrow">
          <div class="ch-switch" id="ch-switch" data-mode="auto">
            <span class="ch-switch-thumb" id="ch-switch-thumb" aria-hidden="true"></span>
            <button type="button" class="ch-switch-opt is-on" id="mode-auto" data-mode="auto" role="tab" aria-selected="true">自动调度</button>
            <button type="button" class="ch-switch-opt" id="mode-manual" data-mode="manual" role="tab" aria-selected="false">指定技能</button>
          </div>
          <!-- MCP 数据源入口：只在管理员开了至少一台、且这台握手成功时出现（JS 控制 hidden）。
               默认全部不勾 = 不调度任何 MCP —— 这是产品默认，也是安全默认：
               没勾也能捅到内网业务系统才是问题。勾选存 localStorage，发送时按 id 计入请求体。
               放在 .ch-mrow 而不是推荐行：推荐行每次 renderChips() 都会清空 innerHTML，
               放那儿会导致按钮随着对话一闪一闪地消失。 -->
          <div class="ch-mcp" id="mcp-box" hidden>
            <button type="button" class="ch-mcp-btn" id="mcp-btn" aria-haspopup="true" aria-expanded="false" aria-controls="mcp-layer">
              <span class="ch-mcp-dot" id="mcp-dot" aria-hidden="true"></span>
              <span id="mcp-label">MCP 数据源</span>
            </button>
            <div class="ch-mcp-layer" id="mcp-layer" hidden role="group" aria-label="选择这轮要用的数据源">
              <div class="ch-mcp-head">勾选后才调度，不勾则完全不调用</div>
              <div class="ch-mcp-list" id="mcp-list"></div>
              <div class="ch-mcp-foot" id="mcp-foot"></div>
            </div>
          </div>
        </div>
        <textarea id="chat-input" class="ch-input" rows="3" placeholder="说说你想写什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="ch-send" id="chat-send" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20V4M6 10l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script src="/assets/vendor/marked/marked.min.js?v=20260909I"></script>
<script src="/assets/js/site.js?v=20260911M"></script>
<script src="/assets/js/chat.js?v=20260922C"></script>
</body>
</html>
