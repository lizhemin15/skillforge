name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: vet / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 —— asset_version.test.mjs 的第四道断言要拿 HEAD~1 比对
          # 「资源内容变了没有」。浅克隆（默认 depth=1）只有 1 个提交，那条会打印
          # skip 并静默失去作用：守卫退化成装饰，而 CI 依然全绿。
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # PDF 生成依赖真正的 .ttf 中文字体：gopdf 无法加载 .ttc（字体集合）和
      # .otf（CFF 轮廓），而 runner 默认一个 CJK 字体都没有——不装这一步
      # 「PDF 字体必须覆盖数字」的回归测试会直接失败（这本身是正确行为）。
      - name: 安装中文字体（PDF 生成依赖）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          fc-list 2>/dev/null | grep -i arphic || true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod / go.sum 不是 tidy 状态，请本地执行 go mod tidy 后提交"
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "::error::以下文件未格式化，请执行 gofmt -w ."
            echo "$fmt"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 ./...

      # ---- 前端闸门。这里每个用例都对应一次真实的「静默故障」——
      # 坏了页面上没有任何报错，只是行为悄悄退化，Go 测试抓不住，只能在前端守：
      #   · 只读文件（style_profile.md 这类不可变锚点）渲染出编辑框+保存按钮
      #     （后端 store.WriteFile 会 400 拒绝，界面在承诺一个做不到的操作）
      #   · 毛玻璃层被删、颗粒层被删、外层又加回 backdrop-filter → 玻璃变回纯色块
      #   · 站点名：保存后页面不刷新 / 站名被当 HTML 注入
      #   · 技能模板文件：后端列了模板、前端一个都不画（用户原话「skill 里怎么没有模板源文件」）
      #   · AI 调度过程可见性：时间线不运行中自动展开 → 用户「一直加载、白等」
      #   · 聊天两种方式：手动选了技能却退化成自动调度（mode/skill 漏发）→「它没听我的」
      #   · 核心技能归类 / 分类结构管理：分组画错、切分类不带鉴权头、按钮不带自己那行的分类名
      #   · 缓存版本号：改了 JS/CSS 忘 bump ?v= → 代码全对但老浏览器跑旧文件，用户看到「你没修」
      #   · 推荐行 /api/chat/suggest：失败全是静默降级（404/500/超时都只退回规则版，无日志）
      #
      # **必须枚举，不许写死清单**：这里曾经写死 9 个 step，于是
      # skill_file_tree_edit_button 和 suggest_timeout_budget 两个测试文件
      # 躺在磁盘上、CI 里从来没跑过 —— 新加测试自动等于不存在。
      # 「枚举」这半边由 web/tests/preflight_parity.test.mjs 跨文件守着：
      # 谁把清单写回去、或让本地 preflight 与 CI 的 go test 参数分叉，都会红。
      - name: 前端语法检查（枚举 web/js/*.js）
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(web/js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::web/js 下没找到任何 .js —— 目录选错或资源被删光，拒绝静默通过"
            exit 1
          fi
          for f in "${files[@]}"; do
            node --check "$f"
            echo "语法 OK  $f"
          done

      - name: 前端回归（枚举 web/tests/*.test.mjs）
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(web/tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::web/tests 下没找到任何 *.test.mjs —— 目录选错或测试被删光，拒绝静默通过"
            exit 1
          fi
          echo "共 ${#files[@]} 个前端回归文件"
          fail=0
          for f in "${files[@]}"; do
            echo "============================= $f"
            node "$f" || { echo "::error::$f 失败"; fail=1; }
          done
          [ $fail -eq 0 ] || exit 1

      # 断言自证：往出货文件里注入真实故障，要求对应断言变红。
      # 全绿的断言集不代表真能抓住故障，这两个脚本把「抓得住」本身也守上。
      - name: 前端断言自证（分类结构管理 / 缓存版本号）
        run: |
          bash web/tests/category_ui_mutation_check.sh
          bash web/tests/asset_version_mutation_check.sh

      # 推荐行（输入框上方那几颗小胶囊）的后端：/api/chat/suggest。
      # 它的失败形态全是「静默降级」——前端 fetch 挂在 .catch 里，404/500/超时
      # 都只是退回规则版推荐行，页面上没有任何异常，日志里也没有。
      # 所以这里既跑单测，也跑注入自证：证明这些断言真的抓得住那几种静默降级。
      - name: 后端回归（推荐行 + 断言自证）
        run: |
          go test ./internal/api/ -run Suggest -count=1
          bash internal/api/suggest_mutation_check.sh

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o skillforge ./cmd/server
          ls -lh skillforge

      - name: Smoke test (启动 + 健康探测)
        run: |
          mkdir -p /tmp/sfdata
          SKILLFORGE_DATA_DIR=/tmp/sfdata SKILLFORGE_ADDR=:8092 \
            SKILLFORGE_JWT_SECRET=ci-smoke-secret-not-real SKILLFORGE_ADMIN_PASS=ci-pass \
            ./skillforge &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/api/skills >/dev/null 2>&1; then
              echo "服务已就绪（第 ${i} 次探测）"
              curl -fsS http://127.0.0.1:8092/api/skills
              # 站名接口必须**免鉴权**可读：未登录访客打开首页也要看到正确站名。
              # 一旦有人把它挪到鉴权后面，页面会静默回落到硬编码的默认名。
              echo "--- /api/site（必须匿名 200）"
              curl -fsS http://127.0.0.1:8092/api/site
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务 30 秒内未就绪"
          exit 1

      - name: Stop server
        if: always()
        run: pkill -f '/skillforge' || true
