name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: vet / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 —— asset_version.test.mjs 的第四道断言要拿 HEAD~1 比对
          # 「资源内容变了没有」。浅克隆（默认 depth=1）只有 1 个提交，那条会打印
          # skip 并静默失去作用：守卫退化成装饰，而 CI 依然全绿。
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # PDF 生成依赖真正的 .ttf 中文字体：gopdf 无法加载 .ttc（字体集合）和
      # .otf（CFF 轮廓），而 runner 默认一个 CJK 字体都没有——不装这一步
      # 「PDF 字体必须覆盖数字」的回归测试会直接失败（这本身是正确行为）。
      - name: 安装中文字体（PDF 生成依赖）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          fc-list 2>/dev/null | grep -i arphic || true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod / go.sum 不是 tidy 状态，请本地执行 go mod tidy 后提交"
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "::error::以下文件未格式化，请执行 gofmt -w ."
            echo "$fmt"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 ./...

      # ---- 前端闸门。这里每个用例都对应一次真实的「静默故障」——
      # 坏了页面上没有任何报错，只是行为悄悄退化，Go 测试抓不住，只能在前端守：
      #   · 只读文件（style_profile.md 这类不可变锚点）渲染出编辑框+保存按钮
      #     （后端 store.WriteFile 会 400 拒绝，界面在承诺一个做不到的操作）
      #   · 毛玻璃层被删、颗粒层被删、外层又加回 backdrop-filter → 玻璃变回纯色块
      #   · 站点名：保存后页面不刷新 / 站名被当 HTML 注入
      #   · 技能模板文件：后端列了模板、前端一个都不画（用户原话「skill 里怎么没有模板源文件」）
      #   · AI 调度过程可见性：时间线不运行中自动展开 → 用户「一直加载、白等」
      #   · 聊天两种方式：手动选了技能却退化成自动调度（mode/skill 漏发）→「它没听我的」
      #   · 核心技能归类 / 分类结构管理：分组画错、切分类不带鉴权头、按钮不带自己那行的分类名
      #   · 缓存版本号：改了 JS/CSS 忘 bump ?v= → 代码全对但老浏览器跑旧文件，用户看到「你没修」
      #   · 推荐行 /api/chat/suggest：失败全是静默降级（404/500/超时都只退回规则版，无日志）
      #
      # **必须枚举，不许写死清单**：这里曾经写死 9 个 step，于是
      # skill_file_tree_edit_button 和 suggest_timeout_budget 两个测试文件
      # 躺在磁盘上、CI 里从来没跑过 —— 新加测试自动等于不存在。
      # 「枚举」这半边由 web/tests/preflight_parity.test.mjs 跨文件守着：
      # 谁把清单写回去、或让本地 preflight 与 CI 的 go test 参数分叉，都会红。
      - name: 前端语法检查（枚举 web/js/*.js）
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(web/js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::web/js 下没找到任何 .js —— 目录选错或资源被删光，拒绝静默通过"
            exit 1
          fi
          for f in "${files[@]}"; do
            node --check "$f"
            echo "语法 OK  $f"
          done

      - name: 前端回归（枚举 web/tests/*.test.mjs）
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(web/tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::web/tests 下没找到任何 *.test.mjs —— 目录选错或测试被删光，拒绝静默通过"
            exit 1
          fi
          echo "共 ${#files[@]} 个前端回归文件"
          fail=0
          for f in "${files[@]}"; do
            echo "============================= $f"
            node "$f" || { echo "::error::$f 失败"; fail=1; }
          done
          [ $fail -eq 0 ] || exit 1

      # 断言自证：往出货文件里注入真实故障，要求对应断言变红。
      # 全绿的断言集不代表真能抓住故障，这几个脚本把「抓得住」本身也守上。
      - name: 前端断言自证（分类结构管理 / 缓存版本号 / 输入区布局与贴底滚动 / 思考材料的渲染 / MCP 数据源勾选 / 线上验收 leg 接线）
        run: |
          bash web/tests/category_ui_mutation_check.sh
          bash web/tests/asset_version_mutation_check.sh
          # 这条 15 注入的自证此前**哪里都没调用**（不在 CI、不在 preflight），
          # 只有人手动跑；它是 chat_modes.test.mjs 的唯一牙齿，被漏掉等于那套
          # 断言（勾选层开关、点外关闭、推荐行抖动）没人守。
          python3 web/tests/chat_ui_mutation_check.py
          python3 web/tests/chat_composer_mutation_check.py
          # 材料的「后端发了、前端没渲染」形态只在 Go 侧看不出来（后端确实发了，
          # 所以 go test 和 SSE 验收全绿），必须由前端这一层自证抓得住。
          python3 web/tests/chat_trace_mutation_check.py
          # MCP 数据源勾选（用户级门控）。这条门控失灵的方向是**多给**：
          # 模型工具表里静默多挂一台内网业务系统，谁都不会发现 —— 而漏给用户会当场骂。
          # 所以尺子朝「关闭」倒（不勾=空数组 / 已下架的 id 剔掉 / 清单空=按钮收回）。
          # 6 条注入各自精确打红它自己那条断言；其中第 6 条专打「抠不到函数就静默空跑」
          # —— 崩溃红（rc!=0 但没有 FAIL 行）在这种自证里算不合格。
          python3 web/tests/chat_mcp_mutation_check.py
          # 线上验收（真浏览器 + 真服务 + 真模型）天然进不了 CI，于是天然会腐烂。
          # 这条自证守的是「接线」：伪造 SKIP 必须判失败、声明里的两条 leg 必须真跑
          # 两次、runner 退回写死清单必须被 roster 测试抓住。它不需要服务/模型，
          # 所以能在 CI 里跑 —— 这正是它存在的理由。
          bash web/tests/live_e2e_roster_mutation_check.sh
          # 「解释器探测」那条：候选名单两边脱钩 / 探测写死单一路径 / 只看存在不探活
          # ——三种退化看着都像对的，靠注入自证它们会被抓住（Bug O）。
          python3 web/tests/python_resolve_mutation_check.py
          # 上面那条是**文本**断言：只能证明 install.sh 里写着 $PATH 兜底，
          # 证明不了它真能把 /opt/xxx/bin/python3 认出来。这条才是真跑：从
          # install.sh 里抠出探测段，在 mount namespace 里把候选路径遮蔽掉
          # （bind /dev/null，本机 /usr/bin/python3 不受影响），再真跑一遍看它
          # 认不认 $PATH 上那个。前缀是 sudo：遮蔽需要 CAP_SYS_ADMIN。
          # runner 用不了 mount namespace 时**明说未验证**，不假装绿。
          if sudo unshare -m true 2>/dev/null; then
            sudo -E python3 web/tests/install_python_probe_live_check.py
            sudo -E python3 web/tests/install_python_probe_live_check.py --mutation-selfcheck
          else
            echo "::warning::本 runner 用不了 mount namespace，「\$PATH 兜底真跑」这一条在 CI 里**未验证**（部署机 preflight 里真跑）"
          fi
          # 「业务技能停用一次就从界面蒸发」那条（Bug N）。这条自证跨三层：
          # 前端契约（管理端打哪个接口）、后端契约（路由/ListAll 有没有被改回去）、
          # 后端行为（go test 真停用一个技能再看全量列表）。它内部会跑 go test，
          # 所以必须排在本 step 之后的 Go 环境里 —— setup-go 在上面，照跑。
          python3 web/tests/skill_disabled_admin_ui_mutation_check.py
          # 内置「数据治理任务开发」技能的自证：提示词是纯文本，没有任何编译期
          # 约束 —— 少个 await、示例调了清单外的 API、播种默认打开，全是 go build
          # 看得见、断言看不见的退化，而用户的感受就是「生成的技能跟我给的没关系」。
          python3 scripts/seed_gov_skill_inject.py
          # MCP 接入自证：28 路真故障注入（传输层 / 适配层 / HTTP 契约 / 前端字段名跨层）。
          # 退化的共同形态是「后台显示一切正常，对话里却调不到工具」——单测全绿也照样发生，
          # 所以必须让尺子自己会红。内部跑 go test，本 step 已有 Go 环境。
          python3 scripts/mcp_inject.py

      # 离线包 install.sh 的「装后服务探测」：正向场景 + 两路注入自证。
      #
      # 为什么要紧：2026-09-15 线上事故的判定方式就是这段代码 —— ocrd 进程活着、
      # 端口听着，但抽字全废，安装过程一路绿。用户在内网机上看到的
      # 「8093/extract connection refused / 扫描件解析全废」正是这么漏出去的。
      #
      # 为什么三路都要跑：这段逻辑是「读 HTTP 正文 + 判断 JSON 字段」，两路注入
      # 各打一个真实退化形态 —— INJECT=1 退回「只认 HTTP 200」（历史判定方式）、
      # INJECT=2 退回「只写 while 条件」的读循环（丢掉无换行结尾的最后一行正文，
      # 而那正是真 ocrd 的响应形态）。只跑正向的话，这两路会静静地腐烂：
      # 它们的代码路径在平时根本不执行，不跑就既不报错也不变红。
      #
      # 注入模式的退出码语义是反的：**rc=0 表示"确实按预期转红了"**，
      # 所以这里绝不能加 `|| true` —— 那会让「注入后根本没红」也变成通过。
      # preflight_parity.test.mjs 里有一条专门盯这个。
      - name: 离线包装后探测自证（正向 + 两路注入）
        run: |
          bash deploy/offline/tests/install_probe_test.sh
          INJECT=1 bash deploy/offline/tests/install_probe_test.sh
          INJECT=2 bash deploy/offline/tests/install_probe_test.sh

      # 离线包 install.sh 的几把尺子（都是从 install.sh 里抠真代码跑，不重抄实现）：
      #   · 装前内存检查：正向 6 档（充裕/偏紧/偏小/容器限额/探测不到/硬拦回归）+ 5 路突变自证
      #   · 对外访问地址默认值、时区处理、TLS 信任预检：三种「静默失效」的现场
      #   · 自检时区栏的离线双向对照（需要 root + unshare，CI 里非 root 会显式 SKIP 而非假绿）
      #   · TLS 信任预检：正向 5 场景（已在位 / 路径缺失 / 无系统根证书 / 两样都缺 / 纯 http）+ 4 路突变自证
      #     —— 突变那 4 路专治「安装期三把尺子只有正向场景」这个缺口：
      #        坏路径被静默忽略、无根证书时沉默、客户显式 --public-url 被覆盖、时区探测了却不写进 env
      - name: 离线包 install.sh 验收（内存 / 地址 / 时区 / 信任预检 / 自检时区）
        run: |
          bash deploy/offline/tests/test_install_memory.sh
          bash deploy/offline/tests/test_install_memory_mutation.sh
          bash deploy/offline/tests/test_install_public_url.sh
          bash deploy/offline/tests/test_install_timezone.sh
          bash deploy/offline/tests/test_install_trust_precheck.sh
          bash deploy/offline/tests/test_install_precheck_mutation.sh
          bash deploy/offline/tests/test_selftest_tz_offline.sh

      # 基座体检（`-diag`）：这条链路的失败形态全是「客户装完才发现」——
      # 老基座（glibc 2.17 / systemd 219）上 ocrd 起不来，journal 只有一行加载器报错；
      # 而修法（换基座？改配置？）光看那行原文判断不出来。所以判据前移到**装之前**：
      #   · test_install_prediag.sh         —— 从出货 install.sh 抠出真 prediag_gate 跑 5 场景
      #   · test_install_prediag_mutation.sh —— 4 路真故障注入（放行 / 吞错码 / 老包被误判 / 不转发原文）
      #   · baseline_diag_mutation_check.py —— **双向**真跑：假 systemd-run（219 真实帮助文本）
      #     造老基座 vs 真环境，A 场景必须命中结论、B 场景必须不命中同一条。
      #     只验 A：把判定写成「恒报不可用」也能过；只验 B：写成「恒报可用」也能过。
      # 这三条曾整目录免疫（`deploy/offline/tests` 既不叫 `_mutation_check` 也不在
      # web/tests 下）—— 写好了、能跑了，却没有任何闸门调用。现由 preflight_parity.test.mjs
      # 按目录收着，掉出去会红。
      - name: 离线包装前体检 / 基座体检（-diag 双向 + 两路自证）
        run: |
          bash deploy/offline/tests/test_install_prediag.sh
          bash deploy/offline/tests/test_install_prediag_mutation.sh
          python3 deploy/offline/tests/baseline_diag_mutation_check.py

      # `-selftest` 的「文档解析服务」这一栏：真跑出货二进制，五种结论各一条场景
      # （真能干活 / 僵尸服务 / 冒名服务 / 显式禁用 / 指向远端连不上）。
      # 单测喂的是合成证据，证明不了「从敲命令到屏幕出现结论」这条真链。
      # 这条脚本本身就是「自称的尺子」的活教材：它写死的检查项数量在 F3/F5 加了两栏后
      # 失配，而它当时没被任何闸门调用 —— 于是红着也没人知道。现已接进两头。
      - name: 离线包自检「文档解析服务」栏真跑
        run: python3 deploy/offline/tests/selftest_parse_live_check.py

      # 元守卫的行为自证：preflight_parity.test.mjs 本身也是「纯文本断言 + 按目录枚举」，
      # 它的失效形态同样是「一切正常」。这里对它注入真故障（拿掉接线、拿掉 INJECT=2、
      # 挂 || true、往黑洞目录丢没人接线的尺子），要求它每次都红在预期那条。
      - name: 接线守卫自证（preflight_parity 注入）
        run: bash web/tests/preflight_parity_mutation_check.sh

      # 推荐行（输入框上方那几颗小胶囊）的后端：/api/chat/suggest。
      # 它的失败形态全是「静默降级」——前端 fetch 挂在 .catch 里，404/500/超时
      # 都只是退回规则版推荐行，页面上没有任何异常，日志里也没有。
      # 所以这里既跑单测，也跑注入自证：证明这些断言真的抓得住那几种静默降级。
      - name: 后端回归（推荐行 + 断言自证）
        run: |
          go test ./internal/api/ -run Suggest -count=1
          bash internal/api/suggest_mutation_check.sh

      # 「intent=docgen 却命中写作技能」这条路的失败形态是静默降级：
      # 用户点「生成 Word」拿到一段正文，页面上不报错、日志里也没异常。
      # 纠偏闸门（PickDocGenSkill）必须同时挂单测和注入自证 ——
      # 只装闸门不挂尺子，闸门恒不开也没人知道（本闸门初版就是这样：
      # 契约锚点认了一个真实提示词里不存在的字面量，生产里永远不开）。
      - name: 后端回归（文件意图纠偏 + 断言自证）
        run: |
          go test ./internal/api/ -run 'TestRouteFileIntent|TestRouteWriteIntent' -count=1
          bash internal/api/chat_route_file_intent_mutation_check.sh

      # 写作链路的步骤板是用户在这一轮里唯一能看到的进展来源：板上出现两个 ①、
      # 其中一个永远在转，或者编号栏印出前端认不得的英文 phase，用户读到的都是「卡住」。
      # 契约断言挂在出货的前端 chat.js 上（AGENTS 表的键就是后端 phase 的合法取值集合）。
      - name: 后端回归（步骤板渲染契约 + 断言自证）
        run: |
          go test ./internal/api/ -run 'TestWriteSkillBoardShowsPlanThenDraft|TestPlainPathBoardShowsPlanThenDraft' -count=1
          bash internal/api/chat_board_contract_mutation_check.sh

      # Eval 是每轮对话的**第一跳**：它的解析失败不是少一个字段，而是整包分类丢失
      # 加一次重试。线上 2026-09-19 实测模型判断完全正确，只有 params 被双重编码成
      # 字符串（对象被序列化进字符串里），Go 严格解就 `cannot unmarshal string into
      # Go struct field Eval.params` —— 整包丢掉、白跑一次模型调用，用户看到的是
      # 「卡着的计时」。容忍层只宽容形状不宽容语法，这条尺子同时守着两边。
      - name: 后端回归（Eval 手抖容忍 + 断言自证）
        run: |
          go test ./internal/agent/ -run 'TestEval' -count=1
          bash internal/agent/eval_flex_mutation_check.sh

      # 分类跳（① 意图分析）是用户按发送后的第一跳，也是它把「卡着的计时」演给用户看：
      # 线上实测这一跳静默 54.0s，屏幕上只有「已用 Ns」在 +1。它的材料两个来源都会
      # 空掉（思考链被显式关掉 / provider 整段缓冲），所以本地旁白必须真的挂着。
      - name: 后端回归（分类跳旁白 + 断言自证）
        run: |
          go test ./internal/api/ -run 'TestClassifyNarration|TestClassifyHopNarrates' -count=1
          bash internal/api/classify_narration_mutation_check.sh

      # 这两条 .py 自证脚本此前**没有任何地方调用**：CI 里没有 step、本地也没跑。
      # 后果是可预测的 —— category_guard_inject.py 的一条锚点早就跟实现脱钩
      # （categoryErrStatus 里 ErrNotManualSkill 被有意删掉），脚本自己在那行
      # 打了「锚点失效 ✗」，但因为没有 step，谁也不会看见。
      # 防线不跑就等于没有防线，而「永远绿的自证脚本」比没有更糟：
      # 它会让人以为这块有人看着。
      - name: 后端断言自证（分类结构管理 / 思考开关矩阵）
        run: |
          python3 scripts/category_guard_inject.py
          python3 scripts/fastjson_knob_inject.py
          python3 scripts/thinking_knob_inject.py

      # 沙箱限额（run_python 的 cgroup MemoryMax / Timeout）的负向自证。
      # 为什么单列一条：这是单机离线客户的**真阻碍** —— 模型写的解析脚本一碰大文件
      # 就被 cgroup OOM 秒杀，旧实现只回一句没有信息量的「退出码 -1」；而
      # MemoryMax=256M 是硬编码，客户拿不到源码就无从调。上面的 `go test ./...`
      # 只证明「旋钮读得到、诊断分得对」，证明不了「旋钮失效时有人会红」。
      - name: 后端断言自证（沙箱限额可覆盖 / 失败诊断）
        run: python3 internal/tools/exec_limits_mutation_check.py

      # C1（线上逐页统计）的解析器自证。它原来写的是 grep 'text_pages' 进度流，
      # 而进度流里从来只有人话「共 4 页（文本层直取 2 / OCR 2）」——
      # 这条断言在线上永远红，把 C2/C3 的真实结论淹没了。
      # fixture 是真实线上抓的 SSE：绿 + 三处篡改必红 + 老断言必红，防止再退回去。
      - name: 素材验收断言自证（逐页统计解析器）
        run: bash testdata/mixed/verify_stats_selfcheck.sh

      # 「模型链路偷偷不走流式」的守卫自证（失败用户报的原发现场：353.3 秒零帧）。
      # 它一直在仓库里、也一直在本机能跑，但**没有任何地方调用**它 —— 而且更糟：
      # 脚本里把仓库根写死成 /root/skillforge，CI 的工作目录是 $GITHUB_WORKSPACE，
      # 所以它想接也接不上。这正是 preflight_parity 守卫报「ci.yml 里没有调用」的成因。
      # 现在根目录从脚本自身位置推导，本地与 CI 同一份逻辑（连带守 gofmt：它用 sed 改 Go 源码）。
      - name: 前端断言自证（漏接流式守卫）
        run: bash web/tests/stage_streaming_guard_mutation_check.sh

      # 内置「数据治理任务开发」技能：出货提示词里「## 六、完整示例」那两个示例脚本
      # 是**教模型怎么写脚本的范本**。它们一旦跟 gov-runner 的 API 脱钩（改名、改返回
      # 形状），模型照着写出来的东西在客户现场就是运行期报错 —— 而提示词文本、Go 单测、
      # 示例代码块本身都不会红。所以这道尺子不查文本，它起一个假 AI 桩、调**真 runner**
      # 执行示例脚本，验 Excel/Word 产物内容（含模板样式指纹：表头底色 C6D9F1、
      # 双线 double sz=8、列宽 2400 有没有真传进产出）。
      # CI 上 gov-runner 必然缺席：它是 DataToolbox 编译出的外部产物，不在本仓库。
      # 缺席时脚本会打**醒目 SKIP 横幅**并明说「本项不算 PASS、这块无人看守」——不装绿。
      # 真跑的腿在 scripts/preflight.sh（那边加 GOV_RUNNER_REQUIRED=1，把 SKIP 直接
      # 升级成 FAIL，不给「永远 SKIP 的尺子」留活路），连同 INJECT=1/2 两路负向自证。
      - name: 内置技能示例脚本真跑（无 runner 则醒目 SKIP，不算 PASS）
        run: python3 web/tests/gov_examples_mutation_check.py

      # 解析服务（ocrd）的纯单测。它们是**第三个免疫区**：本机能跑、0 引用，
      # 于是 test_ocrd_quality.py 里钉死的版本串 `ocrd-v5-quality` 跟真值
      # `ocrd-v5-runtime-guard` 分叉了很久，2/15 一直在红，但没人被提醒去看。
      # 现在它们由 web/tests/preflight_parity.test.mjs 的「deploy/ocr 可跑单测」
      # 那一组按目录守着（新增 test_*.py 不接进来就红）。
      # 抱怨②「可选中页该直取文本层、不该无脑走 OCR」的判据就在这里。
      # 同目录的 verify_*.sh 要靠 PyInstaller 冻结二进制，本机没有时是 SKIP/FAIL
      # exit 2（见 verify_runtime_loss.sh:56），所以它们不在这条路上，
      # 由 deploy/ocr/Dockerfile:97 与 scripts/deploy_ocrd.sh 在发版时挡住。
      # 依赖必须由**声明的清单**装进来，不能靠「本机恰好有」。
      # 2026-09-16 的教训：这一步第一次接上时直接跑脚本，本机早装好 pymupdf 所以全绿，
      # runner 上没有 → `ModuleNotFoundError` 退出 1，main 直接红，而红的原因跟
      # 「可选中页该不该走 OCR」这条判据一点关系都没有（环境红冒充断言红，会把人带偏）。
      # 用 --user：runner 的 ubuntu-24.04 默认 Python 是 externally-managed，
      # 不带 --user 会被 PEP 668 拒掉。清单本身由 preflight_parity 与真 import 对账。
      - name: OCR 解析服务单测（质量判据 / 退出等待）
        run: |
          python3 -m pip install --quiet --user -r deploy/ocr/test-requirements.txt
          python3 deploy/ocr/test_ocrd_quality.py
          python3 deploy/ocr/test_guard_wait.py

      # A1~A6 判定器（web/tests/judge_stage_streaming_stats.py）自己的尺子。
      # 它此前是本仓库最后一把「CI 里没人碰过」的尺子：判定逻辑只被
      # judge_stage_streaming_e2e.py 执行，而那个 e2e 要真跑一轮 20 分钟训练、
      # 只在 acceptance-live.sh 里被调。于是「ok is None（N/A）被印成 FAIL 且计入 bad」
      # 这种三态错误在 CI 里一路绿灯，只有真跑完一轮训练才可能被看见。
      # 这里用合成料（20+ 帧、4s 间隔）把 PASS / N/A / FAIL 三种状态钉死，秒级。
      - name: A1~A6 流式判定器三态尺子（合成料）
        run: python3 web/tests/judge_stats_three_state_check.py

      # 三态尺子自己的**松/紧双向**注入自证（见 scripts/preflight.sh 同名 selfcheck 的注释）。
      # 「N/A」是唯一能让缺席阶段不算红的口子：宽到 write 也放行就是「一切正常」型假绿，
      # 只有双向注入照得出来。后缀 *_mutation_check.py 由 preflight_parity.test.mjs 守着，
      # 漏挂这一边会红。
      - name: A5 判据双向注入自证
        run: python3 web/tests/judge_a5_double_injection_mutation_check.py

      # 账本脚本（scripts/measure_chat_latency.py）解析层的自证。
      # 2026-09-19 这把尺子自己撒谎：trace 帧是数组，脚本取 `ev[0]`，而第 0 位永远是
      # 「① 意图分析(done)、没有 material」，真材料挂在 active 那格上 → 真值最大静默
      # 3.6s 被报成 66.3s。尺子撒谎时指向的是别人，所以它自己也得被量着。
      - name: 账本脚本解析层变异自证
        run: python3 web/tests/measure_latency_parser_mutation_check.py

      # MCP 连接处显示（用户投诉「堆在一起不是很好看」）的注入自证。
      # 三种「看着整洁其实坏了」的形态：砍掉几个工具名 / 长名字被折断 /
      # 「折叠」是假的（display:flex 盖掉 [hidden] 的默认 display:none）。
      - name: MCP 面板显示变异自证
        run: python3 web/tests/admin_mcp_mutation_check.py

      # 「屏幕上有没有东西在动」那把尺子（chat_material_e2e.py 的 silent_gaps）的离线自证。
      # 用户投诉原话：「一直卡着计时，用户体验不佳」。这条判据最初按**材料长度**判变化，
      # 而材料是截尾滚动窗口（长度顶死 163 字），于是「正在滚」被误报成 **39.8s 静默** ——
      # 差点带着人去修一个没坏的起草跳。改成按材料尾部原文判之后，两个方向都要钉住：
      #   ① 滚动窗口不得报静默（假红会让人修不存在的问题）；
      #   ② 真静止必须被抓出来（假绿意味着流真挂住时 M7 会安静地绿）。
      # 纯逻辑合成料，毫秒级，不需要浏览器与线上服务。
      - name: 静默段判据自证
        run: python3 web/tests/silent_gaps_mutation_check.py

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o skillforge ./cmd/server
          ls -lh skillforge

      - name: Smoke test (启动 + 健康探测)
        run: |
          mkdir -p /tmp/sfdata
          SKILLFORGE_DATA_DIR=/tmp/sfdata SKILLFORGE_ADDR=:8092 \
            SKILLFORGE_JWT_SECRET=ci-smoke-secret-not-real SKILLFORGE_ADMIN_PASS=ci-pass \
            ./skillforge &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/api/skills >/dev/null 2>&1; then
              echo "服务已就绪（第 ${i} 次探测）"
              curl -fsS http://127.0.0.1:8092/api/skills
              # 站名接口必须**免鉴权**可读：未登录访客打开首页也要看到正确站名。
              # 一旦有人把它挪到鉴权后面，页面会静默回落到硬编码的默认名。
              echo "--- /api/site（必须匿名 200）"
              curl -fsS http://127.0.0.1:8092/api/site
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务 30 秒内未就绪"
          exit 1

      - name: Stop server
        if: always()
        run: pkill -f '/skillforge' || true
