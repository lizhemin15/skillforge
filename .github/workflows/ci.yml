name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: vet / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # PDF 生成依赖真正的 .ttf 中文字体：gopdf 无法加载 .ttc（字体集合）和
      # .otf（CFF 轮廓），而 runner 默认一个 CJK 字体都没有——不装这一步
      # 「PDF 字体必须覆盖数字」的回归测试会直接失败（这本身是正确行为）。
      - name: 安装中文字体（PDF 生成依赖）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          fc-list 2>/dev/null | grep -i arphic || true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod / go.sum 不是 tidy 状态，请本地执行 go mod tidy 后提交"
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "::error::以下文件未格式化，请执行 gofmt -w ."
            echo "$fmt"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 ./...

      # 管理端前端防线：只读文件（style_profile.md 这类不可变锚点）不能渲染出
      # 编辑框和「保存」按钮——后端 store.WriteFile 会 400 拒绝，界面在承诺一个
      # 做不到的操作。Go 测试抓不住这半边，只能在前端守。
      - name: 前端回归（只读文件不得渲染保存入口）
        run: |
          node --version
          node --check web/js/admin.js
          node web/tests/readonly_file_editor.test.mjs

      # 毛玻璃层回归：复刻 deepseek.com 的那套玻璃，坏起来是"静默的"——
      # 背景层被删、颗粒层被删、外层又加回 backdrop-filter、聊天页不再锁视口，
      # 页面都不会报错，只是玻璃变回纯色块。肉眼很难发现，必须机器守。
      - name: 前端回归（毛玻璃层契约）
        run: node web/tests/glassmorphism.test.mjs

      # 站点名自定义回归：站名是运行时数据，改错了不报错——只是全站名字不对/
      # 保存后页面不刷新/站名被当 HTML 注入。前端这半边 Go 测试抓不住。
      - name: 前端回归（站点名自定义）
        run: |
          node --check web/js/site.js
          node web/tests/site_config.test.mjs

      # 技能模板文件可见性：模板 .docx/.xlsx 躺在技能目录顶层、fill_template 真在读它，
      # 但管理端文件树曾经一个都不列（用户原话「skill 里怎么没有模板源文件」）。
      # 后端那半由 internal/store 的单测守；「后端列了、前端不画」是同一种用户可见结果，
      # 所以前端这半（分组渲染 + 上传时 target=template 接线）必须也守上。
      - name: 前端回归（技能模板文件）
        run: node web/tests/skill_template_files.test.mjs

      # 调度过程可见性：用户原话「问完以后中间步骤都没有显示，一直加载状态，
      # 最后显示一个最终答案」。后端那半（心跳帧、闲聊也发步骤）由 internal/api
      # 的单测守；这半边是前端——时间线必须运行中自动展开、跑完自动收起、手动开合
      # 优先于自动。函数写对了但没人调用、或展开逻辑被删，界面都会退回「白等」。
      - name: 前端回归（AI 调度台过程可见性）
        run: |
          node --check web/js/chat.js
          node web/tests/chat_trace.test.mjs

      # 聊天两种方式（自动调度 / 指定技能）：坏了界面上没有任何报错——
      # 手动选了技能却退化成自动调度（mode/skill 漏发），用户只会觉得"它没听我的"。
      # 后端那半（ManualEval/ManualSteps）由 internal/agent 的单测守；这半边守
      # 请求体组装、发送守卫、技能面板分组与样式。
      - name: 前端回归（聊天两种方式）
        run: node web/tests/chat_modes.test.mjs

      # 核心技能 = 通用能力（办公文档管家 / 技能工厂），其余归业务技能：
      # 分组画错、核心技能被删掉、切换标记没打鉴权头，界面都不会报错。
      - name: 前端回归（核心技能归类）
        run: node web/tests/core_skills.test.mjs

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o skillforge ./cmd/server
          ls -lh skillforge

      - name: Smoke test (启动 + 健康探测)
        run: |
          mkdir -p /tmp/sfdata
          SKILLFORGE_DATA_DIR=/tmp/sfdata SKILLFORGE_ADDR=:8092 \
            SKILLFORGE_JWT_SECRET=ci-smoke-secret-not-real SKILLFORGE_ADMIN_PASS=ci-pass \
            ./skillforge &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/api/skills >/dev/null 2>&1; then
              echo "服务已就绪（第 ${i} 次探测）"
              curl -fsS http://127.0.0.1:8092/api/skills
              # 站名接口必须**免鉴权**可读：未登录访客打开首页也要看到正确站名。
              # 一旦有人把它挪到鉴权后面，页面会静默回落到硬编码的默认名。
              echo "--- /api/site（必须匿名 200）"
              curl -fsS http://127.0.0.1:8092/api/site
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务 30 秒内未就绪"
          exit 1

      - name: Stop server
        if: always()
        run: pkill -f '/skillforge' || true
