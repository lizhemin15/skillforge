name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 裸二进制：给「我自己会部署」的用户（有 Go 或有自己的一套流程）。
  goreleaser-simple:
    name: 交叉编译并发布
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 注入版本信息
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          MOD=github.com/lizhemin15/skillforge/internal/version
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="skillforge-${{ steps.vars.outputs.version }}-${GOOS}-${GOARCH}${ext}"

          go build -trimpath \
            -ldflags "-s -w \
              -X ${MOD}.Version=${{ steps.vars.outputs.version }} \
              -X ${MOD}.Commit=${{ steps.vars.outputs.commit }} \
              -X ${MOD}.Date=${{ steps.vars.outputs.date }}" \
            -o "$out" ./cmd/server

          sha256sum "$out" > "$out.sha256"
          ls -lh "$out"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: skillforge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            skillforge-*
          if-no-files-found: error
          retention-days: 7

  # 离线一键安装包：给「拷到内网机器上一条命令装完」的用户。
  # 只做 linux（离线包的目标就是 Linux 服务器），带中文字体、许可证和安装脚本。
  offline-bundle:
    name: 离线安装包（linux/${{ matrix.goarch }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 打包脚本会从系统字体目录里挑字体并随附其许可证，所以 runner 上必须先有字体。
      # 这里装的是构建期依赖，跟「客户机器装包时不联网」不冲突——字体是被打进包里的。
      - name: 安装中文字体（离线包要自带，缺了就挑不到字体）
        run: |
          sudo apt-get update -qq
          # poppler-utils 是运行时防线脚本的前置工具：它用 pdftotext 断言「测试料确实没有
          # 文字层」——没有这道前置断言，「必须走 OCR」的前提就是假的，防线会假绿。
          sudo apt-get install -y -qq fonts-arphic-gbsn00lp fonts-arphic-gkai00mp poppler-utils
          ls -l /usr/share/fonts/truetype/arphic-gbsn00lp/
          pdftotext -v 2>&1 | head -1

      - name: 注入版本信息
        id: vars
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 编译 linux/${{ matrix.goarch }} 二进制
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          MOD=github.com/lizhemin15/skillforge/internal/version
          CGO_ENABLED=0 GOOS=linux GOARCH=${GOARCH} \
          go build -trimpath \
            -ldflags "-s -w \
              -X ${MOD}.Version=${{ steps.vars.outputs.version }} \
              -X ${MOD}.Commit=$(git rev-parse --short HEAD) \
              -X ${MOD}.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o /tmp/skillforge-linux-${GOARCH} ./cmd/server
          file /tmp/skillforge-linux-${GOARCH}

      # 出厂前先自查：字体「引用判定」的路径边界回归防线（Bug O）。
      # 放在打包之前——逻辑坏了就别打这个包。
      - name: 回归防线（卸载器路径引用判定 · Bug O）
        run: bash deploy/offline/test-fontref.sh

      # ocrd（文档解析服务）也必须在 CI 里现编译：`build-offline-bundle.sh` 默认强制要
      # --ocr，不传就直接 die → 这一步失败 → `needs: offline-bundle` 不满足 →
      # **整个 GitHub Release 被 skip**（v0.3.21 / v0.3.22 就是这么没有 Release 产物的）。
      # amd64：真编译，并在 almalinux:8 里自检「OCR 真读出了字」（--selfcheck）；
      # arm64：走 QEMU 要 10–30 分钟，本轮明确不做 → 显式 --no-ocr（包里不含解析服务）。
      - name: 编译 ocrd（文档解析服务 · linux/${{ matrix.goarch }}）
        if: matrix.goarch == 'amd64'
        run: |
          chmod +x scripts/build-ocr.sh
          scripts/build-ocr.sh --arch amd64 --selfcheck --out dist-bin/ocrd-amd64
          sha256sum dist-bin/ocrd-amd64 | tee dist-bin/ocrd-amd64.sha256

      # 便携 Python 运行时（离线包要自带解释器用）：在 CI 里现下、传路径给打包脚本。
      # 为什么不让打包脚本自己下：它守着「构建期不联网」这条原则（字体也是从本机已装的
      # 包里拿的）。取料与打包分开，打包脚本保持纯粹、可离线复跑。
      # 为什么资产名不写死在 workflow 里：见 scripts/fetch-python-runtime.sh 头部注释
      # （形如「版本+8位日期」的字面量在本地会被掩码改写，落盘即错 → curl 404）。
      - name: 取便携 Python 运行时（linux/${{ matrix.goarch }}）
        run: |
          chmod +x scripts/fetch-python-runtime.sh
          PKG="$(scripts/fetch-python-runtime.sh --arch "${{ matrix.goarch }}" --outdir /tmp/pyrt)"
          echo "PY_RUNTIME_PKG=$PKG" >> "$GITHUB_ENV"

      - name: 打离线包（自动挑字体 + 带许可证 + 自带解释器 + 确定性 tar）
        run: |
          chmod +x scripts/build-offline-bundle.sh
          ARGS=(--version "${{ steps.vars.outputs.version }}"
                --arch "${{ matrix.goarch }}"
                --binary "/tmp/skillforge-linux-${{ matrix.goarch }}"
                --python-runtime "$PY_RUNTIME_PKG")
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            ARGS+=(--ocr dist-bin/ocrd-amd64)
          else
            ARGS+=(--no-ocr)   # 见上一步注释：arm64 离线包暂不带文档解析服务
          fi
          scripts/build-offline-bundle.sh "${ARGS[@]}"

      # 冒烟：把 --no-ocr 分支真的跑一遍（只为踩通那条路径，产物不发布）。
      # 为什么单独加这一步：c_warn 曾经漏定义，而它唯一的调用点就在 --no-ocr 分支里。
      # amd64 走的是带 ocr 的分支，那条分支在 CI 里从没被执行过；arm64 一用就报
      # "c_warn: command not found"（exit 127）→ arm64 离线包 job 红 → needs 不满足
      # → 整个 GitHub Release 被 skip（v0.3.21 / v0.3.22 / v0.3.23 全是这个死法）。
      # 一句话：没被执行过的分支就是坏的分支。用 amd64 的二进制多打一个不带 ocr 的包，
      # 成本几秒，换这条路径每次 push 都被踩一遍。
      # 顺带把 --no-python-runtime 也踩通：它是「客户自有解释器、不要包里这份」的逃生门，
      # 正常 CI 路径永远走不到 —— 同样属于没人踩过的分支。
      - name: 冒烟 · 异常分支必须能走通（--no-ocr / --no-python-runtime）
        if: matrix.goarch == 'amd64'
        run: |
          chmod +x scripts/build-offline-bundle.sh
          scripts/build-offline-bundle.sh \
            --version "${{ steps.vars.outputs.version }}" \
            --arch amd64 \
            --binary /tmp/skillforge-linux-amd64 \
            --no-ocr \
            --no-python-runtime \
            --outdir /tmp/smoke-no-ocr
          ls -l /tmp/smoke-no-ocr/
          # 不带解释器的包：说明书必须如实告诉用户怎么补、VERSION 必须如实标 no。
          # 这两条是「说明与产物一致」断言的反面 —— 少了它，那个分支只会生成一个
          # 自称「不需要预装 python3」却根本没带解释器的包。
          SMOKE_DIR="$(ls -d /tmp/smoke-no-ocr/*/ )"
          grep -q 'dnf install -y python3' "$SMOKE_DIR/INSTALL.txt" \
            || { echo "::error::--no-python-runtime 的包没告诉用户怎么补解释器"; exit 1; }
          grep -q '^python=no$' "$SMOKE_DIR/VERSION" \
            || { echo "::error::--no-python-runtime 的包 VERSION 里 python= 不是 no"; exit 1; }
          echo "异常分支冒烟通过"

      # 出厂前验货：包里的东西必须能一步步装起来，缺一样就挡在这里，别让用户发现。
      - name: 验货（内容 / 脚本语法 / 校验和 / 许可证）
        run: |
          set -euo pipefail
          TGZ="$(ls dist/skillforge-offline-*-linux-${{ matrix.goarch }}.tar.gz)"
          ROOT="$(basename "$TGZ" .tar.gz)"
          echo "检查：$TGZ"

          # 1) 校验和文件必须与实际字节一致（Release 里给用户的 sha256 不能是错的）
          ( cd dist && sha256sum -c "$(basename "$TGZ").sha256" )

          # 2) 必需内容一个都不能少
          # 注意：别写成 `tar tzf ... | grep -q`。grep -q 命中第一个就退出，tar 会收到
          # SIGPIPE 而非零退出，配合 set -o pipefail 会让整条管道判失败 → 明明有文件也
          # 报「缺少」。这里先把清单读进变量，再用 bash 自身做字符串匹配。
          LIST="$(tar tzf "$TGZ")"
          for f in "bin/skillforge" "fonts/" "licenses/" "install.sh" "uninstall.sh" \
                   "skillforge.service.template" "skillforge.env.example" "README.md" "INSTALL.txt" "VERSION"; do
            case "$LIST" in
              *"/$f"*) ;;
              *) echo "::error::离线包缺少 $f"; exit 1 ;;
            esac
          done

          # 解析服务的「构建基线说明」必须随包：包里主程序 -diag 与 install.sh 的装前体检
          # 都读 bin/ocrd.baseline 才能回答「这份 ocrd 在这台机器上能不能起来」。缺了它，
          # 客户机上永远只能报「读不到基线」，等于把这条诊断能力悄悄降级成没用 —— 而这类
          # 缺件在本地打带 ocr 的包时最容易漏（本机真跑得起来，看不出少了什么）。
          # 按行锚定（^…bin/ocrd$），不用裸子串：bin/ocrd.baseline 也会命中 "bin/ocrd"。
          if grep -qE '(^|/)bin/ocrd$' <<<"$LIST"; then
            grep -qE '(^|/)bin/ocrd\.baseline$' <<<"$LIST" \
              || { echo "::error::离线包里有 bin/ocrd 却没有 bin/ocrd.baseline"; exit 1; }
          fi

          # 3) 脚本语法要在解包前就验证：客户机器上 bash -n 报错等于「一键安装」当场失效
          TMP="$(mktemp -d)"
          tar xzf "$TGZ" -C "$TMP"
          bash -n "$TMP/$ROOT/install.sh"
          bash -n "$TMP/$ROOT/uninstall.sh"

          # 4) install.sh 引用的路径必须真的在包里（路径写错是这类脚本最常见的死法）
          test -x "$TMP/$ROOT/bin/skillforge"
          test -s "$TMP/$ROOT/fonts/$(ls "$TMP/$ROOT/fonts" | head -1)"
          test -s "$TMP/$ROOT/licenses/ARPHICPL.txt"

          # 4.1) 自带解释器：必须在包里、架构必须对、同架构时还必须真跑起来。
          # 「包里有个 python/ 目录」不算数 —— 标准库缺件或架构不符时目录一样在，
          # 装到目标机上却是「解释器能启动、一 import 就炸」，比完全起不来更难查。
          PY_BIN="$TMP/$ROOT/python/bin/python3"
          test -x "$PY_BIN" || { echo "::error::离线包里没有可执行的自带解释器 python/bin/python3"; exit 1; }
          # -L 不能去掉：bin/python3 是补出来的**软链**（真实 python 安装也是这个布局），
          # 不跟链接 file 只会回一句 "symbolic link to python3.12" → 架构解析成空串。
          PY_DESC="$(file -bL "$PY_BIN")"
          case "$PY_DESC" in
            *x86-64*)        PKG_ARCH=amd64 ;;
            *ARM\ aarch64*)  PKG_ARCH=arm64 ;;
            *)               PKG_ARCH="" ;;
          esac
          [ "$PKG_ARCH" = "${{ matrix.goarch }}" ] \
            || { echo "::error::包内解释器架构($PKG_ARCH)与目标架构(${{ matrix.goarch }})不符：$PY_DESC"; exit 1; }
          HOST_ARCH="$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')"
          if [ "$PKG_ARCH" = "$HOST_ARCH" ]; then
            "$PY_BIN" -c 'import json, ssl, sqlite3, hashlib' \
              || { echo "::error::包内解释器起不来或标准库缺件"; exit 1; }
            echo "包内自带解释器可运行：$("$PY_BIN" -V 2>&1)"
          else
            # 跨架构（x86 runner 验 arm64 包）跑不了：如实说「未执行验证」，
            # 不能假装验过 —— 未经执行的检查等于没有检查。
            echo "跨架构包（$PKG_ARCH 在 $HOST_ARCH 上）→ 只验文件与架构，未执行解释器"
          fi
          grep -q '^python=[0-9]' "$TMP/$ROOT/VERSION" \
            || { echo "::error::VERSION 里 python= 不是版本号（包没带上解释器？）"; exit 1; }
          grep -q '不需要预装 python3' "$TMP/$ROOT/INSTALL.txt" \
            || { echo "::error::包里有自带解释器，INSTALL.txt 却没写「不需要预装 python3」——说明书与产物不一致"; exit 1; }

          # 5) 字体覆盖率复验：包里那份字体必须含 0-9（Bug G 的防线，从脚本到产物都要过一遍）
          python3 - "$TMP/$ROOT/fonts" <<'PY'
          import glob, struct, sys
          path = glob.glob(sys.argv[1] + "/*.ttf")[0]
          need = [ord(c) for c in "0123456789ABCZabc"]
          data = open(path, "rb").read()
          n = struct.unpack(">H", data[4:6])[0]
          off = next(12 + i * 16 for i in range(n) if data[12 + i * 16:16 + i * 16] == b"cmap")
          cmap = struct.unpack(">I", data[off + 8:off + 12])[0]
          best = None
          cnt = struct.unpack(">H", data[cmap + 2:cmap + 4])[0]
          for i in range(cnt):
              r = cmap + 4 + i * 8
              pid, eid, so = struct.unpack(">HHI", data[r:r + 8])
              if (pid, eid) in ((3, 10), (0, 4), (0, 6)):
                  best = cmap + so
                  break
              if (pid, eid) in ((3, 1), (0, 3)) and best is None:
                  best = cmap + so
          fmt = struct.unpack(">H", data[best:best + 2])[0]
          cover = set()
          if fmt == 4:
              x2 = struct.unpack(">H", data[best + 6:best + 8])[0]
              seg = x2 // 2
              ends = struct.unpack(">" + "H" * seg, data[best + 14:best + 14 + x2])
              starts = struct.unpack(">" + "H" * seg, data[best + 16 + x2:best + 16 + 2 * x2])
              for s, e in zip(starts, ends):
                  if s != 0xFFFF:
                      cover.update(range(s, e + 1))
          miss = [hex(c) for c in need if c not in cover]
          if miss:
              print("::error::包内字体缺字符 %s" % " ".join(miss))
              sys.exit(1)
          print("包内字体覆盖 0-9 / 拉丁 通过")
          PY

          echo "验货通过"

      - name: 上传离线包
        uses: actions/upload-artifact@v4
        with:
          name: skillforge-offline-linux-${{ matrix.goarch }}
          path: |
            dist/skillforge-offline-*.tar.gz
            dist/skillforge-offline-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建 GitHub Release
    needs: [goreleaser-simple, offline-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -lh dist

      # Release 是给人下载的，发布前再确认一次「离线包在里面」，免得链接发出去了才发现没附上。
      - name: 确认离线包已附
        run: |
          set -euo pipefail
          for a in amd64 arm64; do
            ls dist/skillforge-offline-*-linux-$a.tar.gz >/dev/null \
              || { echo "::error::Release 缺少 linux/$a 的离线包"; exit 1; }
          done

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
